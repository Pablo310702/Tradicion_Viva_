databases:
  - name: tradicion-viva-db
    plan: free
    databaseName: tradicion_viva
    user: tradicion_viva

services:
  - type: web
    name: tradicion-viva
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradicion-viva-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TRACCAR_BASE_URL
        value: "https://demo.traccar.org"
