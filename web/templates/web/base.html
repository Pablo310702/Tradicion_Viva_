<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TRADICIÓN VIVA{% endblock %}</title>

  <style>
    :root{
      --bg:#0f0f10;
      --panel:#151515;
      --card:#1b1b1b;
      --border:#2a2a2a;
      --muted:#bdbdbd;
      --white:#fff;
      --gold:#d4af37;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--white);
      line-height:1.45;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .topbar{
      height:4px;
      background:var(--gold);
    }

    header{
      background:#000;
      border-bottom:1px solid #1f1f1f;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      padding:18px 16px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .brand{
      font-size:18px;
      font-weight:800;
      letter-spacing:.5px;
      text-align:center;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:28px 16px 60px;
    }

    .layout{
      display:grid;
      grid-template-columns: 260px 1fr;
      gap:20px;
      align-items:start;
    }

    .sidebar{
      background:#121212;
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      position:sticky;
      top:20px;
    }

    .sidebar-logo{
      width:88px;
      height:88px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--border);
      background:#0f0f0f;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:16px;
    }

    .sidebar-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .sidebar-title{
      font-size:18px;
      font-weight:800;
      margin:0 0 14px;
      line-height:1.3;
    }

    .side-links{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .side-links a{
      display:block;
      padding:10px 12px;
      border:1px solid #2d2d2d;
      border-radius:12px;
      color:#ddd;
      font-size:14px;
      font-weight:600;
      transition:.15s ease;
    }

    .side-links a:hover{
      border-color:var(--gold);
      color:var(--gold);
      background:#181818;
    }

    .section-title{
      margin:0 0 18px;
      font-size:22px;
      font-weight:800;
    }

    .hero-box{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 12px 28px rgba(0,0,0,.25);
    }

    footer{
      border-top:1px solid #222;
      background:#0b0b0b;
      color:#aaa;
    }

    .footer-inner{
      max-width:1200px;
      margin:auto;
      padding:20px 16px;
      font-size:14px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    @media (max-width:900px){
      .layout{
        grid-template-columns: 1fr;
      }

      .sidebar{
        position:static;
      }

      .brand{
        font-size:16px;
      }
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>

  <div class="topbar" {% block topbar_style %}{% endblock %}></div>

  <header>
    <div class="header-inner">
      <div class="brand">
        {% block brand %}
        TRADICIÓN VIVA — Sistema de Gestión Procesional
        {% endblock %}
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">
      <div>TRADICIÓN VIVA</div>
      <div>Sistema de Gestión Procesional para Hermandades y Cofradías</div>
    </div>
  </footer>

</body>
</html>
