services:
  web:
    ports:
      - "9000:8000"
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2", "--timeout", "120", "--capture-output", "--log-level", "info", "--access-logfile", "-", "--error-logfile", "-"]

  caddy:
    profiles: ["https"]

volumes:
  postgres_data:
    name: tradicion_viva_staging_postgres_data
  redis_data:
    name: tradicion_viva_staging_redis_data
  static_data:
    name: tradicion_viva_staging_static_data
  media_data:
    name: tradicion_viva_staging_media_data
  caddy_data:
    name: tradicion_viva_staging_caddy_data
  caddy_config:
    name: tradicion_viva_staging_caddy_config
